<app-encabezado-pagina
  eyebrow="Seguridad"
  titulo="Usuarios y accesos"
  descripcion="Cuentas que pueden iniciar sesión en el sistema. Cada usuario pertenece a un empleado y tiene un único rol permanente."
>
  <button acciones type="button" class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="crear()">
    <app-icono nombre="mas" [tamano]="16" />
    Crear usuario
  </button>
</app-encabezado-pagina>

@if (avisoCreacion()) {
  <p class="lr-nota mb-3" role="status">
    <app-icono nombre="construccion" [tamano]="16" />
    <span>El formulario de creación de usuarios se habilitará al conectar esta pantalla con el módulo M01. Solo el ADMINISTRADOR podrá crear cuentas y asignar roles.</span>
  </p>
}

<div class="lr-herramientas" role="search">
  <label class="lr-buscador">
    <app-icono nombre="buscar" [tamano]="16" />
    <input type="search" placeholder="Buscar por empleado o username" [value]="busqueda()" (input)="actualizarBusqueda($event)" />
  </label>

  <select class="form-select" aria-label="Filtrar por rol" [value]="rol()" (change)="actualizarRol($event)">
    <option value="">Todos los roles</option>
    @for (r of roles; track r[0]) {
      <option [value]="r[0]">{{ r[1] }}</option>
    }
  </select>

  <app-segmento etiqueta="Estado" [opciones]="estados" [(valor)]="estado" />
</div>

<app-tabla-listado
  [columnas]="columnas"
  [total]="0"
  vacioIcono="usuarios"
  vacioTitulo="Sin usuarios para mostrar"
  vacioDescripcion="Aquí se listarán las cuentas de acceso con su rol permanente y su estado."
/>

<div class="lr-leyenda mt-3">
  <span>Estados:</span>
  <span class="lr-estado lr-estado--activo">Activo</span>
  <span class="lr-estado lr-estado--inactivo">Inactivo</span>
  <span class="ms-md-3">Roles permanentes:</span>
  @for (r of roles; track r[0]) {
    <span class="lr-pildora">{{ r[1] }}</span>
  }
</div>
