<app-encabezado-pagina
  eyebrow="Caja"
  titulo="Cobros y control de caja"
  descripcion="Cobro de cuentas, registro de pagos y control del turno. Las funciones se habilitarán con los módulos M09 y M10."
>
  <span acciones class="lr-pildora">Sin turno de caja abierto</span>
</app-encabezado-pagina>

<section class="lr-rejilla lr-rejilla--ancha" aria-label="Estado de caja">
  <article class="lr-tarjeta lr-columna lr-columna--pendiente">
    <header>
      Cuentas por cobrar
      <small>0</small>
    </header>
    <div>Las cuentas que el salón envíe a caja aparecerán aquí.<br />Próximamente.</div>
  </article>
  <article class="lr-kpi">
    <span>Turno de caja</span>
    <strong aria-label="Sin datos">—</strong>
    <small>Apertura y cierre disponibles con M10</small>
    <app-icono nombre="reloj" [tamano]="18" />
  </article>
</section>

<h2 class="lr-seccion">Operaciones</h2>
<section class="lr-rejilla lr-rejilla--ancha">
  @for (a of accesos; track a.ruta) {
    <app-tarjeta-modulo
      [titulo]="a.etiqueta"
      [descripcion]="a.detalle"
      [icono]="a.icono"
      [ruta]="a.ruta"
      [disponible]="a.disponible === true"
    />
  }
</section>
