spring.application.name=backend

# SQL Server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seguridad / JWT
# JWT_SECRET es obligatoria: clave de al menos 32 caracteres. Nunca escribir el valor aqui.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Usuario DUENO inicial. Solo se crea cuando la tabla usuarios esta vacia
# y ambas variables de entorno estan definidas. Sin valores por defecto.
app.security.dueno-inicial.username=${APP_DUENO_USERNAME:}
app.security.dueno-inicial.password=${APP_DUENO_PASSWORD:}

# CORS (origen del frontend Angular, separado por comas si hay varios)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
